[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-word-citations"
version = "0.3.0"
description = "Discover DOI placeholders in Word, import missing Zotero records, and create active citation fields."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Zotero Word Citations contributors" }]
keywords = ["zotero", "microsoft-word", "doi", "citations", "vba"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pywin32>=306; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/Payam-PJD/zotero-word-citations"
Repository = "https://github.com/Payam-PJD/zotero-word-citations"
Issues = "https://github.com/Payam-PJD/zotero-word-citations/issues"

[project.scripts]
zotero-word-cite = "zotero_word_citations.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
